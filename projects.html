<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games - Justine Ilagan</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#00ffff;
  min-height:100vh;
  transition: background 0.5s, color 0.5s;
}

nav{
  display:flex;
  justify-content:space-between;
  padding:15px 30px;
  background:rgba(0,0,0,0.6);
  position:sticky;
  top:0;
  z-index:10;
}

nav a{
  color:inherit;
  text-decoration:none;
  margin-left:15px;
  font-weight:bold;
  transition:0.3s;
}
nav a:hover{color:#ff69b4;}

#games{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:30px;
  padding:60px 20px;
}

.game-card{
  width:220px;
  height:220px;
  background:rgba(255,192,203,0.08);
  border:1px solid currentColor;
  border-radius:20px;
  box-shadow:0 0 30px currentColor inset,0 0 15px currentColor;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:0.3s, box-shadow 0.2s, transform 0.2s;
  position:relative;
  overflow:hidden;
  color:#ff69b4;
}

.game-card:hover{
  transform:scale(1.1) rotateY(10deg);
  box-shadow:0 0 50px currentColor,0 0 30px currentColor inset;
}

.game-card:active{
  transform:scale(1.15) rotateY(15deg);
  box-shadow:0 0 70px currentColor,0 0 50px currentColor inset;
}

.game-card::before,
.game-card::after{
  content:"";
  position:absolute;
  width:200%;
  height:2px;
  background: linear-gradient(90deg,transparent,currentColor,transparent);
  animation: animate-line 2s linear infinite;
}
.game-card::after{ transform: rotate(90deg); }
@keyframes animate-line{ 0% {transform:translateX(-100%);} 100% {transform:translateX(100%);} }

.game-card h3{ margin:0; font-size:1.5em; text-shadow:0 0 10px currentColor; }
.game-card p{ margin-top:10px; text-align:center; }

button#themeBtn{
  margin-top:20px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:#ff69b4;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}
button#themeBtn:hover{ transform:scale(1.1); background:#ff85c1; }
</style>
</head>
<body>

<nav>
  <strong>Justine Ilagan</strong>
  <div>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="projects.html">Games</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<section id="games">
  <div class="game-card" data-link="games/calculator.html">
    <h3>Calculator</h3>
    <p>Calculator</p>
  </div>
  <div class="game-card" data-link="games/snake.html">
    <h3>Snake Game</h3>
    <p>Classic Snake Adventure</p>
  </div>
  <div class="game-card" data-link="games/car.html">
    <h3>Car Game</h3>
    <p>Car Racing Experience</p>
  </div>
</section>

<button id="themeBtn">Change Theme</button>

<script>
// Open game pages on click
document.querySelectorAll('.game-card').forEach(card=>{
  card.addEventListener('click',()=>{
    window.location.href=card.getAttribute('data-link');
  });
});

// Theme toggle
const themeBtn=document.getElementById('themeBtn');
let isPink=true;
themeBtn.addEventListener('click',()=>{
  if(isPink){
    document.body.style.background='linear-gradient(135deg,#2c003e,#5f007f,#a200ff)';
    document.body.style.color='#ff69b4';
    document.querySelectorAll('.game-card').forEach(c=>c.style.color='#ff69b4');
  }else{
    document.body.style.background='linear-gradient(135deg,#0f2027,#203a43,#2c5364)';
    document.body.style.color='#00ffff';
    document.querySelectorAll('.game-card').forEach(c=>c.style.color='#00ffff');
  }
  isPink=!isPink;
});
</script>

</body>
</html>
