<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About - Justine Ilagan</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#00ffff;
  min-height:100vh;
  transition: background 0.5s, color 0.5s;
}

nav{
  display:flex;
  justify-content:space-between;
  padding:15px 30px;
  background:rgba(0,0,0,0.6);
  position:sticky;
  top:0;
  z-index:10;
}

nav a{
  color:inherit;
  text-decoration:none;
  margin-left:15px;
  font-weight:bold;
  transition:0.3s;
}
nav a:hover{color:#ff69b4;}

section{
  padding:60px 20px;
  text-align:center;
}

.card{
  background: rgba(255,255,255,0.08);
  border:1px solid currentColor;
  border-radius:15px;
  max-width:600px;
  margin:20px auto;
  padding:25px;
  box-shadow:0 0 20px currentColor;
  transition: box-shadow 0.3s;
}

.card:hover{
  box-shadow:0 0 40px currentColor;
}

button#themeBtn{
  margin-top:20px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:#ff69b4;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}
button#themeBtn:hover{
  transform:scale(1.1);
  background:#ff85c1;
}
</style>
</head>
<body>

<nav>
  <strong>Justine Ilagan</strong>
  <div>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="projects.html">Games</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<section>
  <h1>About Me</h1>
  <div class="card">
    <p>“I’m Justine, and I know how to use HTML, CSS, and JavaScript. I love playing online games, and I want to continue learning programming.”</p>
  </div>
  <button id="themeBtn">Change Theme</button>
</section>

<script>
const themeBtn = document.getElementById('themeBtn');
let isPink = true;
themeBtn.addEventListener('click',()=>{
  if(isPink){
    document.body.style.background='linear-gradient(135deg,#2c003e,#5f007f,#a200ff)';
    document.body.style.color='#ff69b4';
  }else{
    document.body.style.background='linear-gradient(135deg,#0f2027,#203a43,#2c5364)';
    document.body.style.color='#00ffff';
  }
  isPink=!isPink;
});
</script>

</body>
</html>
