<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Justine Ilagan</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#00ffff;
  min-height:100vh;
  transition: background 0.5s, color 0.5s;
}

/* NAVIGATION */
nav{
  display:flex;
  justify-content:space-between;
  padding:15px 30px;
  background:rgba(0,0,0,0.6);
  position:sticky;
  top:0;
  z-index:10;
}
nav a{
  color:inherit;
  text-decoration:none;
  margin-left:15px;
  font-weight:bold;
  transition:0.3s;
}
nav a:hover{color:#ff69b4;}
nav a img{
  width:24px;
  height:24px;
  vertical-align:middle;
  transition: transform 0.3s, filter 0.3s;
}
nav a img:hover{
  transform: scale(1.2);
  filter: drop-shadow(0 0 5px #ff69b4);
}

/* CONTACT SECTIONS */
section{
  text-align:center;
  padding:60px 20px;
}
.contact-box{
  max-width:350px;
  margin:20px auto;
  padding:25px;
  border-radius:15px;
  background:rgba(255,255,255,0.08);
  box-shadow:0 0 20px currentColor;
  transition:0.3s;
}
.contact-box:hover{
  transform:scale(1.05);
  box-shadow:0 0 40px currentColor;
}

button#themeBtn{
  margin-top:20px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:#ff69b4;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}
button#themeBtn:hover{
  transform:scale(1.1);
  background:#ff85c1;
}

footer{
  text-align:center;
  padding:20px;
  background: rgba(0,0,0,0.4);
}
</style>
</head>
<body>

<nav>
  <strong>Justine Ilagan</strong>
  <div>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="projects.html">Games</a>
    <a href="contact.html">Contact</a>
    <a href="https://github.com/justineilagan003" target="_blank" title="GitHub">
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg" alt="GitHub">
    </a>
  </div>
</nav>

<section>
  <h1>Contact Me</h1>

  <!-- Email box -->
  <div class="contact-box">
    <p>Email: justineilagan003@gmail.com</p>
    <p>Feel free to reach out for collaborations or feedback!</p>
  </div>

  <!-- GitHub box -->
  <div class="contact-box">
    <p>GitHub Account:</p>
    <a href="https://github.com/justineilagan003-netizen" target="_blank" style="color:#ff69b4; text-decoration:none; font-weight:bold;">
      https://github.com/justineilagan003
    </a>
  </div>

  <!-- Theme button -->
  <button id="themeBtn">Change Theme</button>

</section>

<footer>
  © 2026 Justine Ilagan
</footer>

<script>
// Theme toggle
const themeBtn=document.getElementById('themeBtn');
let isPink=true;
themeBtn.addEventListener('click',()=>{
  if(isPink){
    document.body.style.background='linear-gradient(135deg,#2c003e,#5f007f,#a200ff)';
    document.body.style.color='#ff69b4';
  }else{
    document.body.style.background='linear-gradient(135deg,#0f2027,#203a43,#2c5364)';
    document.body.style.color='#00ffff';
  }
  isPink=!isPink;
});
</script>

</body>
</html>
