<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 Snake Game</title>
<style>
body {
  display:flex; justify-content:center; align-items:center;
  flex-direction:column; background:#000; margin:0; height:100vh; color:white;
  font-family: Arial, sans-serif;
}
canvas {
  background:#111;
  display:block;
  margin:20px 0;
}
button {
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:cyan;
  color:black;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}
</style>
</head>
<body>

<h1>Real Snake Game</h1>
<canvas id="snakeCanvas" width="400" height="400"></canvas>
<button onclick="restartGame()">Restart</button>

<script>
const canvas = document.getElementById("snakeCanvas");
const ctx = canvas.getContext("2d");

const box = 20;
let snake = [{x: 9*box, y: 10*box}];
let food = spawnFood();
let dir = "RIGHT";
let score = 0;
let game;

// Desktop keys
document.addEventListener("keydown", e => {
    if(e.key === "ArrowLeft" && dir!="RIGHT") dir="LEFT";
    if(e.key === "ArrowRight" && dir!="LEFT") dir="RIGHT";
    if(e.key === "ArrowUp" && dir!="DOWN") dir="UP";
    if(e.key === "ArrowDown" && dir!="UP") dir="DOWN";
});

// Mobile swipe
let touchStartX=0, touchStartY=0;
canvas.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});
canvas.addEventListener('touchend', e => {
  let dx = e.changedTouches[0].clientX - touchStartX;
  let dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>0 && dir!="LEFT") dir="RIGHT";
    else if(dx<0 && dir!="RIGHT") dir="LEFT";
  } else {
    if(dy>0 && dir!="UP") dir="DOWN";
    else if(dy<0 && dir!="DOWN") dir="UP";
  }
});

// Spawn food
function spawnFood(){
  return {
    x: Math.floor(Math.random()*(canvas.width/box))*box,
    y: Math.floor(Math.random()*(canvas.height/box))*box
  };
}

// Collision with self
function hitSelf(head, snakeArray){
  for(let i=1;i<snakeArray.length;i++){
    if(head.x===snakeArray[i].x && head.y===snakeArray[i].y) return true;
  }
  return false;
}

// Draw rounded rectangle for snake segment
function drawSegment(x,y,color){
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.arc(x+box/2, y+box/2, box/2, 0, Math.PI*2);
    ctx.fill();
}

// Draw everything
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Draw snake
    for(let i=snake.length-1;i>=0;i--){
        if(i===0){
            drawSegment(snake[i].x, snake[i].y, "lime"); // head
            // eyes
            ctx.fillStyle="black";
            ctx.beginPath();
            ctx.arc(snake[i].x+box/4, snake[i].y+box/4, 2,0,Math.PI*2);
            ctx.arc(snake[i].x+3*box/4, snake[i].y+box/4, 2,0,Math.PI*2);
            ctx.fill();
        } else {
            drawSegment(snake[i].x, snake[i].y, "green"); // body
        }
    }

    // Draw food
    drawSegment(food.x, food.y, "red");

    // Move snake
    let headX = snake[0].x;
    let headY = snake[0].y;
    if(dir==="LEFT") headX -= box;
    if(dir==="RIGHT") headX += box;
    if(dir==="UP") headY -= box;
    if(dir==="DOWN") headY += box;

    // Eat food
    if(headX===food.x && headY===food.y){
        snake.push({}); // grow
        score++;
        food = spawnFood();
    }

    // Move body
    for(let i=snake.length-1;i>0;i--){
        snake[i].x = snake[i-1].x;
        snake[i].y = snake[i-1].y;
    }
    snake[0].x = headX;
    snake[0].y = headY;

    // Collision
    if(headX<0||headY<0||headX>=canvas.width||headY>=canvas.height||hitSelf(snake[0],snake)){
        clearInterval(game);
        alert("Game Over! Score: "+score);
    }
}

// Restart game
function restartGame(){
    snake = [{x: 9*box, y:10*box}];
    dir = "RIGHT";
    score=0;
    food = spawnFood();
    clearInterval(game);
    game = setInterval(draw,150);
}

game = setInterval(draw,150);
</script>
</body>
</html>
